
# ── Oh My Marx overrides (@1103 · pr/bible/server/matrix) · appended 2 th generated homeserver.yaml, later keys win ──
# client-only (no federation), registration only w a token (th app has it), no media, no presence
public_baseurl: "https://scagent.de/"
listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    bind_addresses: ["0.0.0.0"]
    resources:
      - names: [client]
        compress: false
enable_registration: true
registration_requires_token: true
federation_domain_whitelist: []
allow_public_rooms_over_federation: false
allow_public_rooms_without_auth: false
trusted_key_servers: []
suppress_key_server_warning: true
enable_media_repo: false
url_preview_enabled: false
presence:
  enabled: false
rc_registration:
  per_second: 0.05
  burst_count: 3

# CI — shared gates fr am0/ci (go/pr/ops/apps_platform.md P1) · @261108 · runs on th VPS runner
#   server/  = omm-api: gitleaks · ruff · bandit · pip-audit · pytest+cov · img canary + trivy
#   android/ = gradle lint (only errs NOT i app/lint-baseline.xml) + unit tsts + release build
#              verify only: no reg token, throwaway key ➡ th CI apk is nvr shipped (bin/ship.sh stays manual)
# red ➡ ntfy alerts · log: `cilog` (ops)
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: am0/ci/.forgejo/workflows/app.yml@v1   # cross-repo ➡ am0/ci must stay public
    with:
      {name: omm, dir: server, req: requirements-dev.txt, src: ".", cov: 85, image: true, android: android,
       # 🩹 D-030 A (ops adr.md): 3g memcg killed run 940 (gradle 2.38G + Robolectric 630M) ➡ smaller JVMs, same cap
       #   2nd -D wins over app.yml's -Xmx1536m · --max-workers=2 = fewer parallel heaps · test fork 512m (app/build.gradle.kts)
       #   ➡ move into app.yml default once am0 moves v1, then drop th override here
       gradle: '-Dorg.gradle.jvmargs="-Xmx1280m -XX:MaxMetaspaceSize=768m" --max-workers=2 lintDebug testDebugUnitTest assembleRelease'}
    secrets: inherit

  # 🌐 D-091: ship guard on evy push (D-087/088 added 7 tr() strings ➡ 11 langs half-EN, only ship.sh wd hv seen it)
  #   stdlib python only, no LLM · fix = bin/translate.py --only ui on tow ➡ commit
  langs:
    runs-on: docker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0 (same sha as am0/ci)
      - run: python3 bin/check_langs.py
      - run: python3 -m unittest bin/test_bin.py

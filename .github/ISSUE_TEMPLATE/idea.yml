name: 💡 Idea or wish
description: Something you'd like the app to do, or do differently
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: wish
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why / when would you use it?
      description: Optional — the situation helps more than the solution.

name: 🐛 Something's broken
description: The app crashed, looks wrong, or does something odd
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What did you do, what happened, what did you expect?
      description: Free text, any length, any language. Steps + expectation help most. Screenshot optional but great (drag it in here).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: ⚙️ ➡ Über (bottom), e.g. 0.7.0
  - type: input
    id: phone
    attributes:
      label: Phone + Android version (optional)
      placeholder: e.g. Pixel 7, Android 15
